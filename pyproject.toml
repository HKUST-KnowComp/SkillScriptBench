[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscriptbench"
version = "0.1.0"
description = "Benchmark and evaluation tools for executable agent skill packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{name = "SkillScriptBench authors"}]

[project.urls]
Paper = "https://arxiv.org/abs/2610.04008"

[project.optional-dependencies]
evaluation = ["markdown-it-py==3.0.0", "mdurl==0.1.2", "python-pptx==1.0.2", "lxml==6.1.3", "Pillow==12.3.0", "XlsxWriter==3.2.9", "PyYAML==6.0.3"]
dev = ["pytest>=8,<10"]

[project.scripts]
skillscriptbench = "ssbench.cli:main"

[tool.setuptools]
packages = ["ssbench"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runtime", "benchmark", "node_modules", ".venv"]
